<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introduction to System Design</title>
<meta name="description" content="A 42-chapter course on system design fundamentals, readable offline.">
<meta name="theme-color" content="#2f6feb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="System Design">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="2" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
      <line x1="6" y1="2.5" x2="6" y2="13.5" stroke="currentColor" stroke-width="1.3"/>
    </svg>
  </button>

  <div class="app" id="app">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>System Design</h1>
        <p>Introduction · 42 chapters</p>
        <button id="install-btn" class="install-btn" type="button" hidden>
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 2v8m0 0l-3-3m3 3l3-3M3 12.5h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Install app
        </button>
        <span id="offline-badge" class="offline-badge" hidden>Offline</span>
      </div>
      <nav id="chapter-list" class="chapter-list"></nav>
    </aside>

    <main class="content">
      <div class="content-inner">
        <div class="chapter-toolbar">
          <span id="read-progress" class="read-progress"></span>
          <button id="mark-read-btn" class="mark-read-btn" type="button">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="mark-read-label">Mark as read</span>
          </button>
        </div>

        <div id="markdown-view" class="markdown-body">
          <div class="placeholder">Select a chapter from the left to begin reading.</div>
        </div>

        <div class="chapter-nav">
          <button id="prev-btn" class="chapter-nav-btn" type="button">← Previous</button>
          <button id="next-btn" class="chapter-nav-btn" type="button">Next →</button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
